# =====================================================================
# EDGE CASES -- the genuinely arguable calls; scored separately
# =====================================================================
edge_cases:

  - id: EC-01
    kind: behaviour_controlling_field
    expected: keep
    statement: "The facet wdw_finder_not_searchable controls whether an offer is excluded from WDW finder search results"
    reasoning: >-
      This is a field, so the field-inventory rule would drop it -- but the field's VALUE gates
      behaviour, exactly the stated exception ("the `authorship` frontmatter gates whether content
      is human-certified"). An agent that knows this skips debugging why an offer is missing from
      search results. A gate that keys on the SHAPE ("X has field Y") drops it; a gate that keys on
      the CONSEQUENCE keeps it.
    slug: "/platform/knowledgebase/sources/dscribe/special-offers/#example"
    file: "platform/knowledgebase/sources/dscribe/special-offers.mdx"
    line: 122
    quote: "\"wdw_finder_not_searchable\": \"true\""
    match:
      subject_any: ["special offers", "facets", "offer"]
      predicate_any: ["controls", "gates", "excludes", "field", "has", "determines"]
      object_all: ["wdw_finder_not_searchable"]

  - id: EC-02
    kind: behaviour_controlling_field
    expected: keep
    statement: "suppress_from_locale determines the locales in which an offer must NOT be displayed"
    reasoning: >-
      The behavioural RULE qualifies (an agent that surfaces a suppressed offer creates a
      compliance problem); the MEMBERSHIP LIST does not (MN-16). The gate must split one sentence
      in the source doc into a keep and a drop -- the hardest kind of call, and the one most likely
      to be resolved by keeping both or dropping both.
    slug: "/platform/knowledgebase/sources/dscribe/special-offers/#example"
    file: "platform/knowledgebase/sources/dscribe/special-offers.mdx"
    line: 246
    quote: "Locales where the offer should not appear"
    match:
      subject_any: ["special offers", "offer", "suppress_from_locale"]
      predicate_any: ["should not", "suppressed", "not appear", "determines", "controls"]
      object_any_groups:
        - ["suppress_from_locale"]
        - ["locales", "not appear"]

  - id: EC-03
    kind: version_pinned
    expected: keep
    statement: "The 99.99% availability target has a timing of CY 2027 -- it is not the current target"
    reasoning: >-
      Actionable ONLY with the date qualifier attached. Stored as "the platform targets 99.99%" it
      is actively misleading today (integration is 99.5% and the four-nines work is future-dated).
      The correct call is keep-with-qualifier; a gate that stores the number without the temporal
      bound has produced a worse memory than none. Arguable because the same sentence is either the
      most useful fact on the page or a trap, depending entirely on whether the qualifier survives.
    slug: "/solution_engineering/platform-decision-log/approved/#d001-standard-platform-classes"
    file: "solution_engineering/platform-decision-log/approved.mdx"
    line: 26
    quote: "99.99% availability target timing is CY 2027"
    match:
      subject_any: ["99.99%", "availability", "platform", "d001"]
      predicate_any: ["target", "timing", "is", "decides", "has"]
      object_all: ["cy", "2027"]

  - id: EC-04
    kind: trap_avoider
    expected: keep
    statement: "gpt-5-chat and gpt-5-chat-latest are NOT reasoning models despite the GPT-5 prefix"
    reasoning: >-
      Structurally this is one row of a model catalogue (MUST-NOT shape), but its content is a
      negation that prevents a wrong inference an agent would otherwise make from the name. The
      step it saves is real: not sending reasoning_effort to a model that ignores it. Gates that
      classify by row-of-a-table will drop this.
    slug: "/products/jedai-gateway/api-integration-guide/#available-models"
    file: "products/jedai-gateway/api-integration-guide.mdx"
    line: 472
    quote: "Standard chat behavior despite the GPT-5 prefix"
    match:
      subject_any: ["gpt-5-chat", "gpt-5-chat-latest"]
      predicate_any: ["not", "is", "are", "standard chat"]
      object_any_groups:
        - ["not reasoning"]
        - ["standard chat behavior"]

  - id: EC-05
    kind: identifier_vs_prose
    expected: keep
    statement: "The Team Admin persona maps to the LiteLLM role string team_admin"
    reasoning: >-
      The surrounding glossary is a catalogue (MN-26), but the role STRING is the literal value an
      agent must send to the API. Persona-to-identifier mappings are shortcuts; persona-to-prose
      descriptions are not. The gate must keep half a table row and drop the other half.
    slug: "/products/jedai-gateway/#role-glossary"
    file: "products/jedai-gateway/index.mdx"
    line: 320
    quote: "| **Team Admin** | `team_admin` |"
    match:
      subject_any: ["team admin"]
      predicate_any: ["holds", "role", "is", "maps"]
      object_all: ["team_admin"]

  - id: EC-06
    kind: combination_only
    expected: drop
    statement: "The max_fallbacks depth counter defaults to 5"
    reasoning: >-
      A real tunable, but actionable only in combination with a configured fallback chain the agent
      cannot see and does not control. On its own it skips no step. Contrast MR-19 (drop_params),
      which changes the observable behaviour of a call the agent is making right now. This is the
      clearest test of whether the gate demands a NAMED step rather than mere technical specificity.
    slug: "/products/jedai-gateway/api-integration-guide/#when-do-fallbacks-trigger"
    file: "products/jedai-gateway/api-integration-guide.mdx"
    line: 801
    quote: "A `max_fallbacks` depth counter (default **5**) prevents infinite recursion"
    match:
      subject_any: ["max_fallbacks", "fallbacks", "router"]
      predicate_any: ["default", "defaults", "is", "prevents"]
      object_all: ["max_fallbacks"]

  - id: EC-07
    kind: diagnostic_header
    expected: keep
    statement: "x-litellm-attempted-fallbacks in the response headers reveals whether a fallback served the request (0 = primary)"
    reasoning: >-
      Looks like a header catalogue row. It qualifies because the JSON body does not tell you a
      fallback happened -- this header is the only way to answer "why did I get a different model?"
      without a support ticket. Arguable because three sibling headers in the same table are much
      weaker candidates.
    slug: "/products/jedai-gateway/api-integration-guide/#response-headers"
    file: "products/jedai-gateway/api-integration-guide.mdx"
    line: 777
    quote: "| `x-litellm-attempted-fallbacks` | Fallback hops taken"
    match:
      subject_any: ["x-litellm-attempted-fallbacks", "response headers", "gateway"]
      predicate_any: ["records", "reveals", "indicates", "is", "header"]
      object_all: ["x-litellm-attempted-fallbacks"]

  - id: EC-08
    kind: person_routing
    expected: drop
    statement: "Governance requirements are documented by Ben; Robert applies them per component; Tae owns operational processes; Carlos owns intake governance"
    reasoning: >-
      This is ownership/routing, which normally qualifies -- "go to X for Y" is a genuine shortcut.
      It is marked DROP because the routing key is a bare first name with no role identifier or
      contact: people change roles far faster than the doc updates, and a stale name sends the agent
      to the wrong human with full confidence. This is the entry I expect most disagreement on, and
      the one that most sharply tests whether the gate weighs decay against step-saving.
    slug: "/solution_engineering/platform-decision-log/approved/#d006-jedai-helix-collaboration"
    file: "solution_engineering/platform-decision-log/approved.mdx"
    line: 118
    quote: "| **Governance (Ben)** | Document explicit data governance requirements |"
    match:
      subject_any: ["governance", "engineering", "operations", "product", "ben", "robert", "tae", "carlos"]
      predicate_any: ["responsible", "documents", "owns", "develops", "applies"]
      object_any_groups:
        - ["ben"]
        - ["robert"]
        - ["tae"]
        - ["carlos"]

  - id: EC-09
    kind: unqualified_threshold
    expected: drop
    statement: "The budget is $500"
    reasoning: >-
      Same number as MR-14, stripped of the qualifier that makes it usable. Without "team-level"
      and "hard cap" an agent cannot tell whether $500 is per key, per team, or per month, and may
      size a workload against the wrong ceiling. Included to test that the gate scores the
      FORMULATION, not the topic -- a gate that matches on "budget threshold" alone keeps this.
    slug: "/products/jedai-gateway/#key-value-props"
    file: "products/jedai-gateway/index.mdx"
    line: 153
    quote: "$500 hard cap"
    match:
      subject_any: ["budget"]
      predicate_any: ["is"]
      object_all: ["$500"]
      forbid_any: ["team", "hard", "cap", "per team", "team-level"]

  - id: EC-10
    kind: cadence
    expected: keep
    statement: "The Special Offers feed updates event-driven, not on a fixed schedule"
    reasoning: >-
      "Event-Driven" is a two-word table cell that reads like an attribute inventory. It qualifies
      because it tells an agent not to wait for, or build, a polling schedule -- a concrete skipped
      step. Arguable because the sibling cells in the same block ("Feed format", "Source team") vary
      in value, so the gate cannot accept or reject the block as a unit.
    slug: "/platform/knowledgebase/sources/dscribe/special-offers/"
    file: "platform/knowledgebase/sources/dscribe/special-offers.mdx"
    line: 22
    quote: "**Update frequency**: Event-Driven"
    match:
      subject_any: ["special offers", "feed"]
      predicate_any: ["update", "frequency", "cadence", "state", "has"]
      object_any_groups:
        - ["event-driven"]
        - ["event driven"]

# =====================================================================
# TEMPORAL AUTHORITY -- WS-25 T5 gold-set regression
# =====================================================================
# NOT scored against the portal-KB graph above.  Scored against the tiny,
# hermetic fixture graph `ingest/build_temporal_authority_fixture.py`
# rebuilds on demand (see that script's docstring for the exact scenario:
# a `preference` reinforced to corroboration_margin, then contradicted by an
# equal-authority, newer observation).
#
# Pre-WS-25 this section scores 0/2: the corroborated incumbent stays current
# truth (`insufficient_corroboration` parks the contradiction) and the fresher
# statement never becomes visible to a reader.  WS-25 T2 makes `preference` a
# recency-authoritative type, so the incumbent auto-closes and the section
# scores 2/2 (1.0).
#
# `must_be_current`   -- the newer, post-contradiction statement must be
#                        CURRENT TRUTH (context-visible).
# `must_not_be_current` -- the superseded statement must NOT be current truth
#                        (it may still exist on disk, superseded -- that is
#                        the correct outcome, not a failure).
# Same match contract as the bands above (subject_any / predicate_any /
# object_all / object_any_groups / forbid_any); no file/line/quote citation
# fields -- this section is not sourced from the portal and is exempt from
# `--verify-citations`.
temporal_authority:
  meta:
    description: >-
      WS-25 T5: a scripted preference-set-then-contradicted fixture that
      fails pre-WS-25 (stale value returned as current truth) and passes
      after T2 (write-side auto-close) + T3 (read-side within-slot
      tiebreaker).
    build_script: "ingest/build_temporal_authority_fixture.py"
    graph: "ingest/.memotron/temporal_authority_fixture.sqlite"

  must_be_current:
    - id: TA-01
      statement: "The user's current preference is NOT dark mode -- the later, equal-authority contradiction is current truth"
      saves: "skip re-deriving the user's current preference from a stale, corroborated-but-superseded fact"
      match:
        subject_any: ["user"]
        predicate_any: ["prefers"]
        object_all: ["not dark mode"]

  must_not_be_current:
    - id: TA-02
      statement: "The original dark-mode preference is superseded, not current truth, even though it had reached corroboration-eligible observed_count before the contradiction arrived"
      why_not: "recency-authoritative supersession (WS-25 T2) auto-closes a same-slot contradiction on a preference/directive/state slot when the challenger's authority is at least the incumbent's, regardless of corroboration count"
      match:
        subject_any: ["user"]
        predicate_any: ["prefers"]
        object_all: ["dark mode"]
        forbid_any: ["not"]

# =====================================================================
# COMPACTION SURVIVAL -- WS-28 T3 (+ T1 companion) gold-set regression
# =====================================================================
# NOT scored against the portal-KB graph above.  Scored against the tiny,
# hermetic fixture graph `ingest/build_compaction_survival_fixture.py`
# rebuilds on demand: a transcript window with two DIFFERENT >=3-repeat
# shell commands, one 2-repeat (below-threshold) command, and one
# context_compaction checkpoint, run through
# `AgentMemoryPlatform.record_runbook_commands` / `memory_log` + one dream
# cycle.
#
# Pre-WS-28 this section scores 0/4 (CS-01/CS-02 fail: no runbook fact
# exists at all before T3 lands) or, once command extraction lands but
# before the write-side guard does, 3/4 with CS-02 specifically failing
# (measured: the hermetic embedding transport puts
# "...simulation.py --live" and "...simulation.py --live-fast" at cosine
# 0.926, which clears the default semantic-dedup threshold of 0.88 -- with
# `force_identifier_conflict` disabled this fixture reproducibly collapses
# to 2 relationships instead of 3, the second command reinforcing the
# first's row instead of creating its own; re-enabling the guard restores
# 3).  CS-03 (vacuously true, nothing to capture) and CS-04 (`memory_log`
# already existed pre-WS-28, so this one line was already passing -- it is
# here to prove the checkpoint that seeds T1's immediate rehydration is not
# a special, ephemeral thing, but ordinary durable memory once dreamt) are
# unaffected by the guard either way.
#
# `must_be_current`     -- the fact must be CURRENT TRUTH (context-visible).
# `must_not_be_current` -- the fact must NOT be current truth; for CS-03
#                        this is satisfied vacuously (never stored at all),
#                        which is the correct outcome, not a failure.
# Same match contract as the bands above; no file/line/quote citation
# fields -- this section is not sourced from the portal and is exempt from
# `--verify-citations`.
compaction_survival:
  meta:
    description: >-
      WS-28 T3 (+T1 companion): a scripted transcript-window fixture proving
      (a) a >=3-repeat verbatim command becomes a durable runbook fact,
      (b) a lexically-close but DIFFERENT command becomes its own separate
      fact rather than being semantically merged, (c) a 2-repeat command is
      never captured, and (d) a context_compaction checkpoint is ordinary
      durable memory once dreamt.
    build_script: "ingest/build_compaction_survival_fixture.py"
    graph: "ingest/.memotron/compaction_survival_fixture.sqlite"

  must_be_current:
    - id: CS-01
      statement: "The agent's runbook records the exact live-simulation invocation after 3 repeats"
      saves: "skip re-deriving how to run the live simulation from scratch after a compaction boundary"
      match:
        subject_any: ["compaction-fixture-agent"]
        predicate_any: ["runs"]
        object_all: ["examples/simulation.py", "live"]
        forbid_any: ["live-fast"]

    - id: CS-02
      statement: "The agent's runbook ALSO records the --live-fast invocation as its own separate fact, distinct from CS-01"
      saves: "skip re-deriving the --live-fast invocation; proves the write-side dedup guard kept two lexically-close (cosine 0.926 under the hermetic transport, above the 0.88 default threshold) commands from merging into one"
      match:
        subject_any: ["compaction-fixture-agent"]
        predicate_any: ["runs"]
        object_all: ["examples/simulation.py", "live-fast"]

    - id: CS-04
      statement: "The context_compaction checkpoint's task-focus text is durable, context-visible memory once dreamt"
      saves: "answer 'what was I doing' from the profile with zero tool calls, even well after the compaction boundary that produced the checkpoint"
      match:
        subject_any: ["compaction-fixture-agent"]
        predicate_any: ["has state", "state"]
        object_all: ["task", "focus", "compaction", "survival"]

  must_not_be_current:
    - id: CS-03
      statement: "A command invoked only twice is never captured as a runbook fact"
      why_not: "repeated_commands()'s default min_repeats=3 gate: a one-off (or twice-off) command is not a demonstrated, stable pattern, so it is never memory -- capture requires N observations, not a single one"
      match:
        subject_any: ["compaction-fixture-agent"]
        predicate_any: ["runs"]
        object_all: ["tests/test_context.py", "pytest"]

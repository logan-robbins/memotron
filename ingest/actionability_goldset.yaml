# Actionability gold set for the JedAI portal KB pilot.
#
# THE TEST (the user's principle, verbatim):
#   "Memory is a shortcut for the agent's next action."
#   For every candidate fact, ask: WHAT STEP DOES KNOWING THIS LET THE AGENT SKIP?
#
#   Qualifies:     "you're already authenticated to gh CLI via X, so just use it"
#                  "Special Offers content lives at <path>, go straight there"
#   Does not:      a field inventory -- the agent must open the schema anyway, and
#                  a renamed field makes the memory ACTIVELY MISLEADING.
#   Exception:     a field DOES qualify when it controls behaviour, e.g. "the
#                  `authorship` frontmatter gates whether content is human-certified".
#
# WHAT THIS FILE IS
# -----------------
# The reference answer against which `ingest/score_actionability.py` judges a
# graph. It replaces "does the graph look reasonable" with a number.
#
# Every entry below was authored by READING the portal MDX at the commit named in
# `meta.portal_commit`. Nothing here is a plausible-sounding invention: each entry
# carries `file` + `line` + a `quote` that is an EXACT SUBSTRING of that line, and
# `score_actionability.py --verify-citations` re-checks all of them against the
# portal working tree. If a citation drifts, the harness fails loudly rather than
# scoring against fiction.
#
# BANDS
#   must_remember      -- a gate that drops these has broken the memory
#   must_not_remember  -- a gate that keeps these has filled memory with noise
#   edge_cases         -- the genuinely arguable ones; `expected` records the call
#                         and `reasoning` records why. These are where a gate is
#                         worth judging, and they are scored SEPARATELY so they can
#                         never quietly inflate the headline number.
#
# This is an ABSOLUTE standard, not a relative one. A graph is judged on its own
# terms: did it store what should be stored, and did it keep out what should not.
#
# MATCH CONTRACT (consumed by score_actionability.py)
#   subject_any        -- OR over phrases; a phrase matches when ALL its normalized
#                         tokens are present in the candidate's token set
#   predicate_any      -- OR over phrases, same containment rule
#   object_all         -- AND: every phrase must be contained
#   object_any_groups  -- OR over groups; a group matches when ALL its phrases are
#                         contained (use for genuinely alternative phrasings)
#   Any field may be omitted, in which case it imposes no constraint.
#   The scorer additionally reports whether the match aligned with the candidate's
#   actual subject/predicate/object fields ("structural") or only with the flat
#   fact string ("lexical"); see the README.

meta:
  version: 1
  authored_at: "2026-08-12"
  authored_from: "direct reading of the portal MDX -- no fact is inferred from the graph"
  portal_repo: "/Users/logan.robbins/jedai/portal"
  portal_commit: "d1b1061"
  portal_content_root: "src/content/docs"
  principle: "Memory is a shortcut for the agent's next action. The test is: what step does knowing this let the agent skip?"
  # The subtrees the gold set was authored from. Every entry cites a file under one
  # of these, relative to `portal_content_root`.
  pilot_subtrees:
    - "products/jedai-gateway/"
    - "platform/knowledgebase/"
    - "solution_engineering/platform-decision-log/"


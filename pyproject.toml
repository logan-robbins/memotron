[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source_pkgs = ["memotron"]
# Statement coverage only, deliberately. Branch coverage is strictly better but
# it moves every number down at once, and the floors below are the safety net for
# the module split -- they have to be trustworthy from the first commit. Turn
# `branch` on as its own commit once the split has landed, and re-baseline then.
branch = false
parallel = true
# Required for diff-cover, and so a report produced inside the Harness container
# matches one produced on a laptop.
relative_files = true
omit = ["*/prompts/*"]

[tool.coverage.paths]
source = ["src/memotron", "*/site-packages/memotron", "/harness/src/memotron"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = ".coverage-html"

# The strict tier grew 23 -> 75 modules when the split's output was finally added to
# it. The residue is ONE shape: a function returning what an untyped dependency handed
# back. Not sloppiness, and not fixable inside these files.
#
#   storage/*       psycopg row access is Any. Typing that boundary belongs with the
#                   Postgres work, not here.
#   agent_memory/*  every one returns `await self.client.<method>(...)`, and
#                   memotron.client is still lenient -- so the return IS Any and no
#                   annotation in these files can change it.

# NOT `strict = true`. MEASURED TRAP (mypy 2.3.1, 2026-08-27): `strict` inside a
# per-module override is applied PROJECT-WIDE and silently -- no warning. A/B on
# this exact file: with `strict = true` here, 298 errors in 28 files; with it
# removed, 211 in 20. It looks per-module and is not. `strict` is shorthand for
# the flags below, and THOSE are genuinely per-module, so they are spelled out.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true


# ---------------------------------------------------------------- LENIENT TIER

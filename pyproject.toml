[project]
name = "jedai-memotron"
version = "0.1.0"
description = "Configurable offline memory formation and pruning over a scoped property graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    # FastMCP 4 (#253). NOT the FastMCP vendored inside the `mcp` SDK -- this is the
    # standalone project, and it pulls the SDK itself: fastmcp -> fastmcp-slim[client,server]
    # -> mcp>=2.0.0,<3.0.0. So this single line is also the mcp 1.x -> 2.x upgrade (#184,
    # subsumed). Upper-bounded deliberately: mcp-forge carries `fastmcp>=3.1.0` with NO
    # upper bound, which means a routine `uv lock --upgrade` there would pull a major.
    "fastmcp>=4.0.3,<5.0.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Operational Store engine (memotron.storage.postgres). Kept optional so the
# hermetic SQLite path installs with no driver; the deployment image and the
# Postgres-gated tests install with `--extra postgres`.
postgres = [
    "psycopg[binary,pool]>=3.2",
]
# Public-benchmark scoring (memotron.certification.LocalOfficialBenchmarkJudge). nltk is a full
# NLP toolkit carried for ONE algorithm -- Porter stemming of LoCoMo tokens -- and nothing
# deployed constructs that judge: no tool on examples/mcp_server.py and no admin route
# reference it (verified by grep with positive controls, 2026-09-09). It was a REQUIRED
# dependency until then, so `import memotron` pulled nltk into every process including
# the deployment image. It has produced three advisories in a fortnight, the most recent
# (GHSA-8mgp-746c-j5xp, HIGH) with NO patched version available, so "bump it" is not a
# move that exists. We are not affected -- it needs model-artifact APIs and pathsec
# enforcement, and we use neither -- but carrying an unpatchable HIGH in the shipped image
# for a stemmer is not a trade worth making.
benchmark = [
    "nltk>=3.9.2",
]
# Telemetry (memotron.observability). Optional for the same reason as postgres:
# every call site degrades to a no-op when these are absent, so the hermetic path and a
# developer laptop install nothing extra, while the deployment image installs
# `--extra otel`. The collector these export to is already running in the cluster
# (splunk-otel-collector, observed 2026-09-03) -- see observability/otel.py for why the
# module is vendored rather than depended on.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
]

[project.scripts]
memotron = "memotron.cli:main"
memotron-admin-server = "memotron.admin_server:main"
memotron-local-platform = "memotron.local_platform:main"
memotron-dream-worker = "memotron.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    # The `benchmark` extra is a DEV dependency as well as an optional one, for the same
    # reason `otel` is below: four test modules score against the local official judge, and
    # without nltk here they would fail on construction rather than exercise the metric.
    "nltk>=3.9.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "coverage[toml]>=7.6.0",
    # The `otel` extra is a DEV dependency as well as an optional one, so the telemetry
    # code paths actually execute under test. Without it `observability/otel.py` measures
    # ~20%: every branch past the `try: import opentelemetry` guard is unreachable, and a
    # coverage floor set at that number would be a guard that cannot fail. Installing it
    # here means the module is exercised rather than merely imported.
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
]
lint = [
    "diff-cover>=10.5.0",
    "mypy>=1.18",
    "ruff==0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memotron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# NOTE (pytest 9.0.3, measured 2026-08-27): `--strict-markers` HERE DOES NOT
# ENFORCE. An unregistered mark still only warns. The identical flag passed on
# the command line turns the same mark into a collection error. Reproduced with
# addopts set to "--strict-markers" alone, with "--strict-config --strict-markers",
# and with a plugin-ordering variant -- all three warn; the CLI form errors. The
# flag is kept here so it starts working if that is fixed upstream, but the real
# gate is `scripts/check.sh`, which passes it explicitly. Do not treat this line
# as the guard.
addopts = "--strict-markers --strict-config"
markers = [
    "postgres: needs a live Postgres via MEMOTRON_TEST_POSTGRES_DSN. Skipped, never silently passed, without one.",
    "corpus: needs an official evaluation corpus via MEMOTRON_PUBLIC_CORPUS_DIR.",
]
# Deliberately NO `slow` marker. Measured 2026-08-27: the whole suite runs in
# ~36s and the slowest single test is 2.18s, so a slow/fast split would be
# ceremony that drifts. Revisit only if a test crosses ~10s.

[tool.ruff]
# 120, not ruff's default 88. Measured over all 68,784 source lines: p50=40,
# p90=79, p95=85, p99=100, max=215. The codebase was written to a ~100-col
# budget, so 88 would declare 2,391 existing lines wrong for no reason
# (E501 counts: 88 -> 2391, 100 -> 628, 110 -> 184, 120 -> 43).
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "ui/admin", "benchmarks", "*.ipynb"]

[tool.ruff.lint]
# Tier 1: rules that find DEFECTS, not house style. `--select ALL` reports
# 19,394 violations here, ~90% of which are E501/TRY003/EM101/COM812/D1xx --
# a wall nobody drives to zero. This set is the achievable subset.
# E1/E2/E3/E501 are deliberately absent so the linter never fights the
# formatter, which is not run until after the module split (see [tool.ruff.format]).
select = [
    "F",                                # pyflakes -- the whole reason to do this
    "E4", "E7", "E9", "W",              # pycodestyle, minus the formatter's territory
    "I",                                # isort
    "UP",                               # pyupgrade
    "B",                                # bugbear
    "C4", "PIE", "SIM", "RET", "FLY", "PERF",
    "ISC", "LOG", "G",                  # implicit str concat; logging correctness
    "PYI", "TID", "PT", "DTZ",
    "T20", "A", "ARG", "S",             # print / builtin shadow / unused arg / bandit
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",   # complexity -- see [tool.ruff.lint.mccabe]
    "RUF",
    # Enabled 2026-09-01, each measured at ZERO violations across `ruff check .` --
    # which is the whole point. These cost nothing today and exist to stop the first
    # instance, not to clean up after the hundredth. A family with no violations is
    # the cheapest one to turn on and the only kind that can be turned on without a
    # judgement call at every site.
    #
    #   RSE   raise Foo() not raise Foo          PGH   blanket noqa / type-ignore
    #   Q     quote consistency                  INT   gettext f-string traps
    #   SLOT  __slots__ on str/tuple subclasses  YTT   sys.version_info misuse
    #   PLE   pylint ERRORS only (not R/C/W)     NPY   numpy legacy API
    #   PD    pandas anti-patterns
    #
    # NPY and PD are here despite neither library being a dependency: they are free,
    # and the point of a gate is to be in place BEFORE the code it guards exists.
    "RSE", "PGH", "Q", "INT", "SLOT", "YTT", "PLE", "NPY", "PD",
    # Enabled 2026-09-01 after clearing what they found, each its own small fix:
    #   FURB  20 violations -> 0. 17 auto-fixed (re.I -> re.IGNORECASE; `x if x else y`
    #         -> `x or y`). The other 3 were hand-checked: certification.py's
    #         `fromisoformat(text.replace("Z", "+00:00"))` was redundant, not a bug --
    #         requires-python is >=3.12 and fromisoformat has parsed `Z` since 3.11.
    #   N818   3 -> 0. One real rename (`_RacedRegistration` -> `_RacedRegistrationError`,
    #         private, 4 sites); the two in tests/ are per-file-ignored below.
    "FURB", "N818",
    #   ASYNC blocking I/O inside `async def`. ZERO in src/ -- all 12 live in
    #         examples/, scripts/ and tests/, where the async-ness is incidental
    #         (pytest-asyncio) and a blocking call to a local server is the clearer
    #         test. Ignored there, so this gates the code that actually ships.
    "ASYNC",
]

# --------------------------------------------------------------------- deferred
# Measured 2026-09-01 and deliberately NOT enabled. Recorded so the next person does
# not re-measure, and so the reason is arguable rather than assumed:
#
#   BLE001  63 violations -- 44 scripts/, 10 src/, 7 tests/, 2 other. The count is not
#           why it is deferred. All TEN src/ instances are deliberate fault barriers:
#           do_GET/do_POST converting to a 500, `_run_dream_sequence_worker` catching
#           BaseException in a thread, `maintain_memory`'s daemon loop, `run_cycle`,
#           `_try_enable_pgvector`'s feature probe, and one already annotated
#           `# pragma: no cover - decode with replace cannot raise`. Enabling it yields
#           10 `# noqa` comments and zero fixes. BLE001 cannot tell a fault barrier from
#           a swallowed bug, and a rule whose only effect is annotating correct code
#           trains people to add noqa without reading. Revisit if a real swallowed
#           exception is ever traced to one of these sites.
#
#   TC      244 violations. Churn that would collide with every later refactor phase.
ignore = [
    # Em-dashes and typographic quotes are deliberate throughout the prose.
    "RUF001", "RUF002", "RUF003",
    # Bandit rules that are false here. Each is re-enabled per-file where it isn't.
    "S101",                             # assert -- 4,822 hits, all in tests/
    "S310",                             # urlopen -- every call site passes an explicit timeout
    "S608",                             # SQL string build -- fixed literal table names only
    "S603", "S607",                     # subprocess in scripts/ verification harnesses
    "S104",                             # bind-all -- deliberate in local_platform/admin_server
    # `object` is the third element of a subject/predicate/object triple -- the
    # domain's own vocabulary and part of the public API, so it cannot be renamed.
    # `format` is BaseHTTPRequestHandler.log_message's inherited signature.
    "A002",
    # Deferred to Tier 2 (see the table in docs; enable each as its own commit).
    "ARG001", "ARG002",                 # several are protocol-conformance stubs
    "T201",                             # cli.py and scripts/ legitimately print
]

[tool.ruff.lint.per-file-ignores]
# N818: a test that raises `Boom` is naming the exception after its role in the test --
# "some exception happens here". `BoomError` reads as a real error type and is worse.
"tests/**" = ["S101", "S105", "S106", "SLF001", "PLR2004", "INP001", "ARG001", "ARG005", "PT018",
               "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "N818", "ASYNC"]
# scripts/, examples/ and demo/ are one-shot harnesses and runnable demos. None
# of them ships: [tool.hatch.build.targets.wheel] packages only src/memotron.
# They are held to the rules that find DEFECTS (F, B, RUF, DTZ, ...) and excused
# from the ones that only make sense for long-lived library code:
#   E701/E702  deliberately terse, single-screen probes
#   S110/S112  a sweep RECORDS a failure in its report; raising would end the sweep
#   SIM105     same containment, expressed as try/except so the reason can sit inline
#   SIM115     short-lived scripts that exit right after writing their report
#   PERF401    loop shape is the clearer read in a benchmark that is timing the loop
#   B007/SIM113 loop-variable style in throwaway iteration
"scripts/**" = [
    "T201", "S101", "S108", "S311", "INP001", "E402", "E701", "E702",
    "S110", "S112", "SIM105", "SIM115", "PERF401",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "ASYNC",
]
"examples/**" = ["T201", "INP001", "S110", "SIM105", "SIM115", "PERF401", "B007", "SIM113",
                  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "ASYNC"]
"demo/**" = ["T201", "INP001", "S110", "SIM105", "PERF401",
              "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
# patent/ draws the figures for the patent PDFs -- plotting scripts written in the
# dense one-statement-per-semicolon style that style is conventional for.
"patent/**" = ["T201", "INP001", "E402", "E701", "E702", "ISC001", "C408", "PERF401"]
"src/memotron/__init__.py" = ["F401"]   # the package's re-export surface

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
# Narrowed from ruff's default list, which also names ValueError and OSError.
# ValueError is this codebase's PRIMARY domain error -- config validation,
# policy violations, malformed candidates and governance refusals all raise it --
# so requiring `match=` on all 45 sites would mean pinning 45 assertions to
# message text, which makes them brittle against reworded errors without making
# them meaningfully stricter. `Exception`/`BaseException` stay required, because
# those genuinely can pass on an unrelated failure; the one site that did that
# is fixed rather than suppressed.
raises-require-match-for = ["BaseException", "Exception"]

[tool.ruff.lint.isort]
known-first-party = ["memotron"]
# Guarantees every module the split extracts is born with it. 54 of 58 src files
# already have it; without it an extracted file silently starts EVALUATING
# annotations that used to be strings.
required-imports = ["from __future__ import annotations"]

# --------------------------------------------------------------------- complexity
# A RATCHET, not a standard. Every threshold below is the exact maximum measured
# across src/memotron on 2026-08-29, immediately after the last god-class split.
# So nothing fails today and nothing may get worse -- which is the only honest way to
# turn these on over a research PoC that has a 1,130-line function in it.
#
# These are not aspirational targets. They are a high-water mark, and the numbers are
# left ugly on purpose so the ratchet reads as debt rather than as approval:
#
#   max-statements  191   dreaming/_materialization.py:82  (_materialize_episode)
#   max-branches     39   dreaming/_materialization.py:82  (same function)
#   max-complexity   38   config/_control_plane.py:81
#   max-args         20   client/_ingest.py:46             (add_memory, keyword-only)
#   max-returns      17   dreaming/_entities.py:553
#
# Phase 7 decomposes the god METHODS; each of these should come DOWN with its own
# commit and a measurement, never up. Raising one needs a reason in the message.
#
# tests/, scripts/, examples/ and demo/ are exempted rather than measured: none of
# them ships in the wheel, and letting a fixture set the ceiling for the library
# would defeat the ratchet.
[tool.ruff.lint.mccabe]
max-complexity = 38

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 39
max-returns = 17
max-statements = 191

[tool.ruff.format]
# Run and GATED since 2026-08-29 (`format` lane in scripts/check.sh).
#
# It was deferred through the whole module split, because a formatter run mid-refactor
# collides with every moved block. Actual blast radius when it finally ran: **243 files,
# net -2,225 lines** -- the estimate recorded here while it was deferred said 138 files
# and 7,434 lines, and it aged quietly for ~150 commits. The commit is recorded in
# .git-blame-ignore-revs.
#
# Note for anyone verifying a future format commit: `pure_move.py` is the WRONG gate for
# it and reports false failures, because CPython lays out comprehension jumps by source
# line spread. Use `scripts/verify/ast_identity.py`, which compares the parsed tree.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false            # docstrings contain illustrative pseudo-code

[tool.mypy]
python_version = "3.12"
files = ["src/memotron"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
# 177 BaseModel subclasses across 13 files and 115 validators. Without the plugin
# mypy synthesises `__init__(*args: Any, **kwargs: Any)` for every one of them, so
# the single most valuable check on a 4,361-line policy schema -- did you pass the
# right keyword -- does nothing at all.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# Off globally, on per module below. The point of this file is that `mypy` EXITS 0
# today, so it is a real gate from the first commit rather than a wall of 298
# errors nobody reads. Debt is recorded, not hidden: every entry in the lenient
# tier names the module and the exact codes it still emits.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
no_implicit_reexport = false

# Verified 2026-08-27: pydantic and mcp ship py.typed; these five do not.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "nltk.*", "yaml.*", "psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- STRICT TIER
# 30 of 58 modules pass --strict TODAY, measured, including models.py (the leaf
# every other module imports), storage/base.py, retrieval.py and crypto.py.
# Every module the split extracts is BORN here. Adding a name to this list is
# the definition of "that module's split is done".

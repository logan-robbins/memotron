module = [
    "memotron",
    "memotron.adoption",
    "memotron.agents",
    "memotron.attestations",
    # #251 caveman: every module name is listed UP FRONT, from the design
    # document's module table, so the work packages that build them never need to
    # touch this file and cannot collide here. A caveman module is born strict;
    # there is no lenient-tier entry for any of them and none may be added.
    #
    # `lines` is gone with amendment D's sigil grammar -- its ordering and header
    # logic moved to `render` as word-based equivalents -- and `render`, `replay`,
    # `mcp` and `guidance` arrived with it.
